[project]
name = "telemetrylab"
version = "1.0.0"
description = "A local checkout lab for learning distributed traces, metrics, and correlated logs."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.121.3",
  "uvicorn==0.38.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.38.0",
  "opentelemetry-sdk==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
  "opentelemetry-instrumentation-fastapi==0.59b0",
  "opentelemetry-instrumentation-httpx==0.59b0",
]

[dependency-groups]
dev = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.6", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
